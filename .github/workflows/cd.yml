name: CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for deployment - adjust as needed
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-server:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-server:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-server:cache,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-client:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-client:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-client:cache,mode=max

      - name: Build and push ML service image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-ml-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-ml-service:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-ml-service:cache,mode=max

      - name: Deploy to Raspberry Pi 5
        if: false  # Disabled - requires production setup
        run: |
          echo "Deployment to production requires:"
          echo "1. CLOUDFLARE_TUNNEL_TOKEN secret configured"
          echo "2. Raspberry Pi 5 with Docker Compose running"
          echo "3. Run: docker compose --env-file server/.env up -d --build"
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}