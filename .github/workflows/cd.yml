name: CD

on:
  push:
    branches: [ main, full-developer ]

jobs:
  # The secrets context cannot be used in job/step `if:` conditionals, so the
  # credential check runs first and gates the build job via an output.
  check-creds:
    name: Check Docker Hub credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for Docker Hub secrets
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets are not configured; skipping image push."
          fi

  build-and-push:
    name: Build and push images
    needs: check-creds
    if: needs.check-creds.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-server:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-server:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-server:cache,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-client:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-client:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-client:cache,mode=max

      - name: Build and push ML service image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sentinel-ml-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-ml-service:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sentinel-ml-service:cache,mode=max

      # Deployment to the Raspberry Pi 5 stack stays manual for now:
      #   ssh pi "cd Sentinel && git pull && docker compose --env-file server/.env up -d --build"
      - name: Deploy to Raspberry Pi 5
        if: false
        run: |
          echo "Production deploy runs on the Pi:"
          echo "  docker compose --env-file server/.env up -d --build"
