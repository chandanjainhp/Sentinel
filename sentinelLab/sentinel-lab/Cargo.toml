[package]
name = "sentinel-lab"
version = "0.1.0"
edition = "2021"
description = "Standalone web-based simulator and test harness for the Sentinel predictive-maintenance system"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
