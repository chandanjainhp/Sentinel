version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: ridgeway-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-sentinel}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in server/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-sentinel}
    ports:
      - "28017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  redis:
    image: redis:7-alpine
    container_name: ridgeway-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in server/.env}
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
